{% extends "blog/base.html" %}

{% block title %}Blog Posts{% endblock %}

{% block content %}
<h1>Blog Posts</h1>
{% for post in posts %}
<div class="post">
    <h2>{{ post.title }}</h2>
    <p class="meta">By {{ post.author }} on {{ post.published_date }}</p>
    <p>{{ post.content|truncatewords:50 }}</p>
</div>
{% empty %}
<p>No posts available.</p>
{% endfor %}
{% endblock %}
